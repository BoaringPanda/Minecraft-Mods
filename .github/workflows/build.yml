# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    # Each mod lives in its own folder. To add another mod, copy this job and change the folder name.
    defaults:
      run:
        working-directory: "Mod Creation/VSBetterBuilding"
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # This only checks that the mod compiles. Jars are deliberately NOT uploaded anywhere: they stay on the
      # developer's PC (see the root README and CLAUDE.md).
      - name: build
        run: ./gradlew build
