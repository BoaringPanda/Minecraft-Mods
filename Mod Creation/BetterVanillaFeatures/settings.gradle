pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Names the jar (BetterVanillaFeatures-<version>.jar). The mod ID is the lowercase form of this name
// (bettervanillafeatures), because Fabric mod IDs can't contain capital letters.
rootProject.name = 'BetterVanillaFeatures'
