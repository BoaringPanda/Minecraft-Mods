# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.2

# Mod Properties
# The jar and the in-game version become <mod_version>+<minecraft_version>, e.g. 1.0.0+26.3 (see build.gradle).
# mod_version is MAJOR.MINOR.PATCH: MAJOR when an update can break existing worlds, MINOR for new features
# that are safe for existing worlds, PATCH for bug fixes only.
mod_version=1.0.0
group=com.boaringpanda

# Dependencies
fabric_api_version=0.160.7+26.3
# https://modrinth.com/mod/modmenu/versions
modmenu_version=21.0.0
