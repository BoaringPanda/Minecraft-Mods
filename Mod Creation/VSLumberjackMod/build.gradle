plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// The usual Fabric convention: the mod's own version, then the Minecraft version it's built for.
version = "${project.mod_version}+${project.minecraft_version}"

// The jar's name (BPsLumberjackMod-<version>.jar), separate from the project name.
base {
	archivesName = 'BPsLumberjackMod'
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"vslumberjackmod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Only for the prodClient/prodServer tasks below: the one Fabric API jar, exactly as a player downloads it
	// (not transitive, or its modules would load a second time next to the copies already inside it).
	productionRuntimeMods("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}") {
		transitive = false
	}
}

// Run the finished jar the way a player or a server owner would: the real build output plus the real Fabric
// API jar, launched like a normal install instead of the dev setup that runClient/runServer use.
tasks.register("prodClient", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	runDir = layout.projectDirectory.dir("run/prod-client")
}

tasks.register("prodServer", net.fabricmc.loom.task.prod.ServerProductionRunTask) {
	runDir = layout.projectDirectory.dir("run/prod-server")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// Keep a copy of every finished jar in this mod's jars/ folder (git-ignored, so jars are never uploaded).
tasks.register("copyJarToJars", Copy) {
	from tasks.named("jar")
	into layout.projectDirectory.dir("jars")
}

tasks.named("build") {
	finalizedBy "copyJarToJars"
}
