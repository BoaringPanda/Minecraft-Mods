pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Names the jar (BPsBetterVanillaBuilding-<version>.jar). Deliberately not the mod ID, which stays
// extra_blocks so existing worlds keep their blocks - see CLAUDE.md.
rootProject.name = 'BPsBetterVanillaBuilding'
